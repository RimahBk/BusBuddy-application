<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedules – BusBuddy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <style>
    /* Route cards: a grid on laptops, one row that scrolls sideways on phones */
    .route-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-bottom: 18px; }
    @media (max-width: 640px) {
      .route-cards { display: flex; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
      .route-card { flex: 0 0 78%; scroll-snap-align: start; }
    }
    .route-card {
      display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer;
      font: inherit; color: var(--text); background: var(--white);
      border: 1px solid var(--border); border-left: 6px solid var(--route); border-radius: var(--radius);
      padding: 12px 14px; box-shadow: var(--shadow); min-height: 44px;
    }
    .route-card:hover { border-color: var(--green); border-left-color: var(--route); }
    .route-card[aria-pressed="true"] { background: var(--green-light); border-color: var(--green-dark); border-left-color: var(--route);
                                       box-shadow: 0 0 0 2px var(--green-dark); }
    .rc-name { font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 7px; }
    .rc-od { color: var(--muted); font-size: 14px; }
    .rc-next { font-size: 14px; margin-top: 4px; }
    .rc-next b { color: var(--green-dark); }
    .rc-live { color: var(--green); font-weight: bold; }

    /* Route timeline: a circle for each stop (in the route's colour) joined by a vertical line */
    .timeline { --route: var(--purple); list-style: none; margin: 0; padding: 0; }
    .timeline li { position: relative; padding: 0 0 18px 28px; }
    .timeline li::before { content: ""; position: absolute; left: 0; top: 3px; width: 14px; height: 14px;
                           border-radius: 50%; background: var(--white); border: 3px solid var(--route); box-sizing: border-box; }
    .timeline li::after { content: ""; position: absolute; left: 6px; top: 17px; bottom: 0; width: 2px; background: var(--route); opacity: .25; }
    .timeline li:last-child { padding-bottom: 0; }
    .timeline li:last-child::after { display: none; }
    .sched-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; align-items: start; }
    @media (max-width: 820px) { .sched-layout { grid-template-columns: 1fr; } }
    .tab .count { opacity: .75; font-size: 13px; }
    .trip-card.highlight { outline: 3px solid var(--amber); }
    .trip-card select { width: auto; min-width: 90px; }
    .full { color: var(--red); font-weight: bold; }
    .stop-times { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
    .trip-msg .alert { margin: 12px 0 0; }
  </style>
</head>
<body>
  <header id="topbar"></header>
  <main class="container">
    <h1>Schedules</h1>

    <!-- One card per route: name, origin → destination, next departure -->
    <div id="route-cards" class="route-cards" role="group" aria-label="Choose a route"><p class="muted">Loading routes…</p></div>

    <div class="sched-layout">
      <section class="card">
        <h2>Route timeline</h2>
        <p id="route-info" class="muted"></p>
        <ol id="timeline" class="timeline"><li class="muted">Loading…</li></ol>
      </section>
      <section>
        <h2>Upcoming trips</h2>
        <p id="role-note" class="muted hidden">Only passengers can reserve seats.</p>
        <div id="book-result" class="hidden"></div>
        <div id="day-tabs" class="tabs" role="tablist" aria-label="Day"></div>
        <div id="trips"><p class="muted">Loading…</p></div>
      </section>
    </div>
  </main>
  <footer class="site-footer">BusBuddy · LIU senior project</footer>

  <script>
    BB.ready(async () => {
      await BB.renderNav("schedules.html");
      if (!BB.db) { BB.$(".sched-layout").classList.add("hidden"); BB.$("#route-cards").classList.add("hidden"); return; }   // setup not done yet

      // ---------------------------------------------------------------
      // 1. Who is looking? Guests and passengers see Reserve buttons
      //    (guests are sent to log in); drivers and admins do not.
      // ---------------------------------------------------------------
      const user = await BB.getUser();
      const canBook = !user || user.type === "passenger";
      if (!canBook) BB.$("#role-note").classList.remove("hidden");

      // ---------------------------------------------------------------
      // 2. Load the routes and all stops (stops are grouped by route)
      // ---------------------------------------------------------------
      const { data: routes, error } = await BB.db.from("routes").select("*").order("route_id");
      if (error) { BB.toast(BB.errText(error), "error"); return; }
      if (!routes || !routes.length) {
        BB.$("#route-cards").innerHTML = "";
        BB.$("#timeline").innerHTML = "";
        BB.$("#trips").innerHTML = `<div class="card empty">No routes have been added yet.</div>`;
        return;
      }
      let stopsByRoute = {};
      try { stopsByRoute = await BB.loadStopsByRoute(); } catch (e) { BB.toast(BB.errText(e), "error"); }

      // ---------------------------------------------------------------
      // 3. All upcoming trips of every route (one request): the route cards
      //    use them for "Next departure", the list below for the chosen route
      // ---------------------------------------------------------------
      let allTrips = [];
      async function fetchTrips() {
        const { data, error } = await BB.db.rpc("get_upcoming_trips");
        if (error) { BB.toast(BB.errText(error), "error"); return false; }
        allTrips = (data || []).sort((a, b) => new Date(a.departure_time) - new Date(b.departure_time));
        return true;
      }
      await fetchTrips();

      // Chosen route: ?route=<id>, or the route of ?trip=<id> (back from log in), or the first route
      const backTrip = Number(BB.param("trip"));
      const backTripRow = backTrip ? allTrips.find((t) => t.trip_id === backTrip) : null;
      let route = routes.find((r) => String(r.route_id) === BB.param("route"))
               || (backTripRow && routes.find((r) => r.route_id === backTripRow.route_id))
               || routes[0];

      // ---------------------------------------------------------------
      // 4. Route cards
      // ---------------------------------------------------------------
      const isRunning = (t) => t.status === "active" || t.status === "delayed";

      function routeCardHtml(r) {
        const list = allTrips.filter((t) => t.route_id === r.route_id);
        const live = list.filter(isRunning).length;
        const next = list.find((t) => t.status === "scheduled" && new Date(t.departure_time) > new Date());
        const nextText = next ? `Next: <b>${BB.esc(BB.dayLabel(next.departure_time))} ${BB.esc(BB.fmtTime(next.departure_time))}</b>`
                              : `<span class="muted">No departures planned</span>`;
        const liveText = live ? `<span class="rc-live">● ${live} on the road</span> · ` : "";
        return `<button class="route-card" data-route="${r.route_id}" aria-pressed="${r.route_id === route.route_id}"
                        style="--route:${BB.esc(BB.routeColor(r))}">
            <span class="rc-name">${BB.routeDot(r)}${BB.esc(r.name)}</span>
            <span class="rc-od">${BB.esc(r.origin)} → ${BB.esc(r.destination)}</span>
            <span class="rc-next">${liveText}${nextText}</span>
          </button>`;
      }
      function renderRouteCards() {
        BB.$("#route-cards").innerHTML = routes.map(routeCardHtml).join("");
      }
      BB.$("#route-cards").addEventListener("click", (e) => {
        const card = e.target.closest(".route-card");
        if (!card || Number(card.dataset.route) === route.route_id) return;
        route = routes.find((r) => r.route_id === Number(card.dataset.route));
        history.replaceState(null, "", "schedules.html?route=" + route.route_id);
        BB.show("#book-result", "");
        selectedDay = null;                                   // pick the best day for the new route
        showRoute();
      });

      // ---------------------------------------------------------------
      // 5. Route timeline: every stop in order with "+N min"
      // ---------------------------------------------------------------
      function showRoute() {
        renderRouteCards();
        const card = BB.$(`.route-card[data-route="${route.route_id}"]`);
        if (card) card.scrollIntoView({ block: "nearest", inline: "nearest" });
        BB.$("#route-info").innerHTML = `${BB.routeDot(route)} ${BB.esc(route.name)}: ${BB.esc(route.origin)} → ${BB.esc(route.destination)}
          · <a href="map.html?route=${route.route_id}">See on the map</a>`;
        const stops = stopsByRoute[route.route_id] || [];
        const tl = BB.$("#timeline");
        tl.style.setProperty("--route", BB.routeColor(route));
        tl.innerHTML = stops.length
          ? stops.map((s) => `<li><b>${BB.esc(s.address)}</b><br><span class="muted">+${s.minutes_from_start} min</span></li>`).join("")
          : `<li class="muted">No stops on this route yet.</li>`;
        renderTrips();
      }

      // ---------------------------------------------------------------
      // 6. Day tabs (Today / Tomorrow / later days that have trips)
      //    A bus already on the road counts as today.
      // ---------------------------------------------------------------
      let trips = [];             // trips of the chosen route (all days)
      let selectedDay = null;     // BB.dayKey of the open tab
      const dayOf = (t) => isRunning(t) ? BB.dayKey(new Date()) : BB.dayKey(t.departure_time);
      // "today", "tomorrow" or "on Thu 19 Nov" – for use inside a sentence
      const whenText = (iso) => { const l = BB.dayLabel(iso); return l === "Today" || l === "Tomorrow" ? l.toLowerCase() : "on " + l; };

      function dayTabs() {
        const now = new Date();
        const days = [now, new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1)]
          .map((d) => ({ key: BB.dayKey(d), date: d }));
        trips.forEach((t) => {
          const key = dayOf(t);
          if (!days.some((d) => d.key === key)) days.push({ key, date: new Date(t.departure_time) });
        });
        return days.sort((a, b) => a.date - b.date).map((d) => ({
          ...d, label: BB.dayLabel(d.date.toISOString()), count: trips.filter((t) => dayOf(t) === d.key).length
        }));
      }

      function renderTrips() {
        trips = allTrips.filter((t) => t.route_id === route.route_id);
        const days = dayTabs();
        if (!days.some((d) => d.key === selectedDay)) selectedDay = null;
        if (!selectedDay) selectedDay = (days.find((d) => d.count) || days[0]).key;

        BB.$("#day-tabs").innerHTML = days.map((d) => `<button class="tab ${d.key === selectedDay ? "active" : ""}" role="tab"
            aria-selected="${d.key === selectedDay}" data-day="${d.key}">${BB.esc(d.label)} <span class="count">(${d.count})</span></button>`).join("");

        const box = BB.$("#trips");
        const list = trips.filter((t) => dayOf(t) === selectedDay);
        if (!list.length) {
          const day = days.find((d) => d.key === selectedDay);
          const other = days.find((d) => d.count && d.key !== selectedDay);
          box.innerHTML = `<div class="card empty">No trips on this route ${BB.esc(whenText(day.date.toISOString()))}.
            ${other ? `<div style="margin-top:10px"><button class="btn btn-outline" data-goto-day="${other.key}">See ${BB.esc(other.label)} (${other.count})</button></div>` : ""}</div>`;
          return;
        }
        box.innerHTML = list.map(tripCardHtml).join("");
      }

      BB.$("#day-tabs").addEventListener("click", (e) => {
        const tab = e.target.closest("[data-day]");
        if (!tab || tab.dataset.day === selectedDay) return;
        selectedDay = tab.dataset.day;
        renderTrips();
      });

      // Buttons inside the trip list (one listener, survives re-drawing)
      BB.$("#trips").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.gotoDay) { selectedDay = b.dataset.gotoDay; renderTrips(); return; }
        if (b.dataset.reserve) {
          const t = trips.find((x) => x.trip_id === Number(b.dataset.reserve));
          const seats = Number(BB.$("#seats-" + t.trip_id).value);
          reserve(t.trip_id, seats, t.departure_time, b);
        }
        if (b.dataset.findnext) showNext(Number(b.dataset.findnext), 1);
        if (b.dataset.times) {
          const list = BB.$("#times-" + b.dataset.times);
          list.classList.toggle("hidden");
          b.textContent = list.classList.contains("hidden") ? "Times at stops" : "Hide times";
        }
      });

      // Re-load every trip (after booking) and re-draw the cards and the list
      async function loadTrips() {
        if (await fetchTrips()) { renderRouteCards(); renderTrips(); }
      }

      function tripCardHtml(t) {
        const free = t.available_seats;
        const stops = stopsByRoute[t.route_id] || [];
        const dep = new Date(t.departure_time).getTime();
        const times = stops.map((s) =>
          `<li>${BB.esc(s.address)} – ${BB.fmtTime(new Date(dep + s.minutes_from_start * 60000).toISOString())}</li>`).join("");

        // What the passenger can do on this trip
        let action = "";
        if (t.status !== "scheduled") {
          action = `<a class="btn btn-outline btn-small" href="map.html?trip=${t.trip_id}">On the road – track it</a>`;
        } else if (canBook && free > 0) {
          const options = Array.from({ length: Math.min(4, free) }, (_, i) =>
            `<option value="${i + 1}">${i + 1} seat${i ? "s" : ""}</option>`).join("");
          action = `<select id="seats-${t.trip_id}" aria-label="Number of seats">${options}</select>
                    <button class="btn" data-reserve="${t.trip_id}">Reserve</button>`;
        } else if (canBook) {
          action = `<button class="btn btn-amber" data-findnext="${t.trip_id}">Find the next bus</button>`;
        }

        return `<div class="card trip-card" id="trip-${t.trip_id}">
            <div class="row-between">
              <div class="card-title">${BB.fmtTime(t.departure_time)}</div>
              ${BB.badge(t.status)}
            </div>
            <p class="muted">${BB.esc(BB.fmtDate(t.departure_time))} · Bus ${BB.esc(t.plate_number)}</p>
            <p class="${free === 0 ? "full" : ""}">${free} of ${t.capacity} seats free</p>
            <div class="row">${action}
              <button class="btn btn-outline btn-small" data-times="${t.trip_id}">Times at stops</button>
            </div>
            <ul id="times-${t.trip_id}" class="stop-times hidden">${times || "<li>No stops.</li>"}</ul>
            <div class="trip-msg" id="msg-${t.trip_id}"></div>
          </div>`;
      }

      // ---------------------------------------------------------------
      // 7. Reserve seats (UC-08). Guests go to the login page first.
      //    If the bus is full, offer the next bus with enough seats (UC-09).
      // ---------------------------------------------------------------
      async function reserve(tripId, seats, departure, btn) {
        if (!user) {
          location.href = "login.html?next=" + encodeURIComponent("schedules.html?trip=" + tripId);
          return;
        }
        const ok = await BB.confirmBox(`Reserve ${seats} seat(s) on the ${BB.dayLabel(departure)} ${BB.fmtTime(departure)} trip?`, "Reserve");
        if (!ok) return;
        BB.busy(btn, true, "Reserving…");
        const { error } = await BB.db.rpc("book_seat", { p_trip_id: tripId, p_seats: seats });
        BB.busy(btn, false);

        if (!error) {
          BB.toast("Seat reserved!", "ok");
          const box = BB.$("#book-result");
          box.className = "alert alert-ok";
          box.innerHTML = `Reserved ${seats} seat(s) on the ${BB.esc(BB.fmtDateTime(departure))} trip.
                           <a href="bookings.html">See my bookings</a>`;
          await loadTrips();
          box.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        // "FULL:" is checked on the raw message, before BB.errText removes it
        if ((error.message || "").includes("FULL")) { await showNext(tripId, seats); return; }
        BB.toast(BB.errText(error), "error");
      }

      // Show the next trip with enough free seats inside the card of the full trip
      async function showNext(tripId, seats) {
        const msg = BB.$("#msg-" + tripId);
        const { data, error } = await BB.db.rpc("next_available_trip", { p_trip_id: tripId, p_seats: seats });
        if (error) { BB.toast(BB.errText(error), "error"); return; }
        const next = (data || [])[0];
        if (!next) {
          msg.innerHTML = `<div class="alert alert-warn">This bus is full and there is no later bus with free seats today.</div>`;
          return;
        }
        msg.innerHTML = `<div class="alert alert-warn">This bus is full. The next bus with ${next.available_seats} free seats
            leaves ${BB.esc(whenText(next.departure_time))} at ${BB.fmtTime(next.departure_time)}.
            <div style="margin-top:8px"><button class="btn btn-small">Reserve that one</button></div></div>`;
        const b = BB.$("button", msg);
        b.addEventListener("click", (e) => { e.stopPropagation(); reserve(next.trip_id, seats, next.departure_time, b); });
      }

      // ---------------------------------------------------------------
      // 8. Start: show the route; if we came back from login (?trip=<id>),
      //    open that trip's day, scroll to it and highlight it
      // ---------------------------------------------------------------
      if (backTripRow) selectedDay = dayOf(backTripRow);
      showRoute();
      const card = backTrip && BB.$("#trip-" + backTrip);
      if (card) {
        card.classList.add("highlight");
        card.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });
  </script>
</body>
</html>
