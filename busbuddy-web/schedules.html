<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedules – BusBuddy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/schedules.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <header id="topbar"></header>
  <main class="container">
    <h1>Schedules</h1>
    <div id="route-pick" class="field hidden">
      <label for="route-select">Route</label>
      <select id="route-select"></select>
    </div>
    <p id="route-info" class="muted"></p>

    <div class="sched-layout">
      <section class="card">
        <h2>Route timeline</h2>
        <ol id="timeline" class="timeline"><li class="muted">Loading…</li></ol>
      </section>
      <section>
        <h2>Upcoming trips</h2>
        <p id="role-note" class="muted hidden">Only passengers can reserve seats.</p>
        <div id="book-result" class="hidden"></div>
        <div id="trips"><p class="muted">Loading…</p></div>
      </section>
    </div>
  </main>
  <footer class="site-footer">BusBuddy · LIU senior project</footer>

  <script type="module" src="js/pages/schedules-page.js"></script>
</body>
</html>
