<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live map – BusBuddy</title>
  <link rel="stylesheet" href="js/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/vendor/leaflet/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <style>
    /* Map on the left, list of running buses on the right (stacked on phones) */
    .map-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
    @media (max-width: 820px) { .map-layout { grid-template-columns: 1fr; } }
    .bus-list { display: flex; flex-direction: column; gap: 10px; }
    .bus-card { padding: 12px 14px; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; }
    .bus-card + .bus-card { margin-top: 0; }
    .bus-card:hover, .bus-card:focus { border-color: var(--green); outline: none; }
    .bus-card .muted { margin: 2px 0 0; }
    .refresh-line { margin: -6px 0 14px; }
    .popup-title { font-weight: bold; font-size: 15px; }
  </style>
</head>
<body>
  <header id="topbar"></header>
  <main class="container">
    <h1>Live bus map</h1>
    <p class="muted refresh-line">
      Positions refresh every <span id="poll-sec">10</span> seconds ·
      Last refreshed <span id="last-refresh">–</span>
    </p>
    <div id="map-msg" class="hidden"></div>

    <div class="map-layout">
      <div id="map" class="map"></div>
      <section>
        <h2>Running buses</h2>
        <div id="bus-list" class="bus-list"><p class="muted">Loading…</p></div>
      </section>
    </div>
  </main>
  <footer class="site-footer">BusBuddy · LIU senior project</footer>

  <script>
    BB.ready(async () => {
      await BB.renderNav("map.html");
      if (!BB.db) {                                          // setup not done yet: the banner explains
        BB.$(".map-layout").classList.add("hidden"); BB.$(".refresh-line").classList.add("hidden"); return;
      }

      const POLL = (window.BB_CONFIG && BB_CONFIG.POLL_SECONDS) || 10;
      BB.$("#poll-sec").textContent = POLL;

      // ---------------------------------------------------------------
      // 1. Create the map and draw every route with its stops (loaded once)
      // ---------------------------------------------------------------
      const map = BB.makeMap("map");
      let stopsByRoute = {};
      try { stopsByRoute = await BB.loadStopsByRoute(); }
      catch (e) { BB.toast(BB.errText(e), "error"); }

      const allPoints = [];
      Object.values(stopsByRoute).forEach((stops) => {
        const line = stops.map((s) => [s.latitude, s.longitude]);
        allPoints.push(...line);
        L.polyline(line, { color: "#534AB7", weight: 3, opacity: 0.8 }).addTo(map);
        stops.forEach((s) => {
          // The popup text is built when the stop is clicked, so it uses the latest bus positions
          L.marker([s.latitude, s.longitude], { icon: BB.stopIcon() })
            .bindPopup(() => stopPopupHtml(s))
            .addTo(map);
        });
      });
      if (allPoints.length) map.fitBounds(allPoints, { padding: [30, 30] });

      // ---------------------------------------------------------------
      // 2. Popup texts
      // ---------------------------------------------------------------
      let buses = [];                // latest result of get_live_buses()
      const markers = {};            // trip_id → { marker, status }

      function updatedText(iso) {
        const m = BB.minutesAgo(iso);
        if (m == null) return "No position yet";
        return m < 1 ? "Updated just now" : `Updated ${m} min ago`;
      }
      function seatsText(n) { return `${n} seat${n === 1 ? "" : "s"} free`; }

      // Bus popup: route, plate, status, delay, seats, last update and ETA at each stop ahead
      function busPopupHtml(bus) {
        const eta = BB.computeEta(bus, stopsByRoute[bus.route_id]);
        const etaHtml = eta.length
          ? `<ul class="eta-list">${eta.map((e) => `<li>${BB.esc(e.stop.address)} – ${e.minutes} min</li>`).join("")}</ul>`
          : `<p class="muted">No more stops ahead.</p>`;
        return `<div class="popup-title">${BB.esc(bus.route_name)}</div>
          <div>${BB.esc(bus.plate_number)} ${BB.badge(bus.status)}</div>
          ${bus.delay_minutes ? `<div style="color:var(--amber)">Delayed ~${bus.delay_minutes} min – ${BB.esc(bus.delay_reason || "")}</div>` : ""}
          <div>${seatsText(bus.available_seats)}</div>
          <div class="muted">${updatedText(bus.last_update)}</div>
          <div style="margin-top:6px"><b>Arrival times</b></div>${etaHtml}
          <p style="margin:8px 0 0"><a href="schedules.html">Reserve a seat on a later bus</a></p>`;
      }

      // Stop popup: address, scheduled offset, and the nearest bus that still has this stop ahead
      function stopPopupHtml(stop) {
        let best = null;
        buses.filter((b) => b.route_id === stop.route_id && b.latitude != null).forEach((b) => {
          const hit = BB.computeEta(b, stopsByRoute[b.route_id]).find((e) => e.stop.stop_id === stop.stop_id);
          if (hit && (!best || hit.minutes < best.minutes)) best = { bus: b, minutes: hit.minutes };
        });
        const next = best
          ? `<div>Next bus: <b>${best.minutes} min</b> (${BB.esc(best.bus.plate_number)})</div>`
          : `<div>No bus on the way right now – <a href="schedules.html">see schedules</a></div>`;
        return `<div class="popup-title">${BB.esc(stop.address)}</div>
          <div class="muted">Scheduled: +${stop.minutes_from_start} min from the start</div>${next}`;
      }

      // ---------------------------------------------------------------
      // 3. Side list of running buses (cards). Clicking one zooms to the bus.
      // ---------------------------------------------------------------
      function renderList() {
        const box = BB.$("#bus-list");
        if (!buses.length) {
          box.innerHTML = `<div class="card empty">No buses are running right now.<br>
            <a href="schedules.html">See the schedules</a></div>`;
          return;
        }
        box.innerHTML = buses.map((b) => {
          const next = BB.computeEta(b, stopsByRoute[b.route_id])[0];
          const nextText = b.latitude == null ? "Waiting for the first position"
            : next ? `Next: ${BB.esc(next.stop.address)} – ${next.minutes} min` : "Arriving at the last stop";
          return `<button class="card bus-card" data-trip="${b.trip_id}">
              <div class="row-between"><b>${BB.esc(b.route_name)}</b>${BB.badge(b.status)}</div>
              <p class="muted">${BB.esc(b.plate_number)} · ${seatsText(b.available_seats)}</p>
              <p class="muted">${nextText}</p>
            </button>`;
        }).join("");
        BB.$$(".bus-card", box).forEach((el) => el.addEventListener("click", () => focusBus(Number(el.dataset.trip))));
      }

      function focusBus(tripId) {
        const m = markers[tripId];
        if (!m) { BB.toast("This bus has not shared its position yet."); return; }
        if (window.innerWidth <= 820) BB.$("#map").scrollIntoView({ behavior: "smooth" });
        map.setView(m.marker.getLatLng(), Math.max(map.getZoom(), 14));
        m.marker.openPopup();
      }

      // ---------------------------------------------------------------
      // 4. Polling: ask for the running buses every POLL seconds and
      //    create / move / update / remove one marker per trip
      // ---------------------------------------------------------------
      async function refresh() {
        const { data, error } = await BB.db.rpc("get_live_buses");
        if (error) { BB.show("#map-msg", BB.errText(error), "error"); return; }
        BB.show("#map-msg", "");
        buses = data || [];

        const seen = new Set();
        buses.forEach((b) => {
          if (b.latitude == null) return;                    // trip started but no position yet: listed only
          seen.add(b.trip_id);
          const pos = [b.latitude, b.longitude];
          let m = markers[b.trip_id];
          if (!m) {
            m = markers[b.trip_id] = { marker: L.marker(pos, { icon: BB.busIcon(b.status) }).bindPopup("").addTo(map), status: b.status };
          } else {
            m.marker.setLatLng(pos);
            if (m.status !== b.status) { m.marker.setIcon(BB.busIcon(b.status)); m.status = b.status; }
          }
          m.marker.setPopupContent(busPopupHtml(b));         // stays open if the user opened it
        });
        // Remove markers of trips that ended
        Object.keys(markers).forEach((id) => {
          if (!seen.has(Number(id))) { map.removeLayer(markers[id].marker); delete markers[id]; }
        });

        renderList();
        BB.$("#last-refresh").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      }

      // ---------------------------------------------------------------
      // 5. Start: first refresh, then ?trip=<id> (from "Track my bus"), then keep polling
      // ---------------------------------------------------------------
      let first = true;
      const stop = BB.poll(async () => {
        await refresh();
        if (first) {
          first = false;
          const want = Number(BB.param("trip"));
          if (want) {
            if (markers[want]) focusBus(want);
            else BB.toast(buses.some((b) => b.trip_id === want)
              ? "Your bus has not shared its position yet." : "This trip is not running right now.");
          }
        }
      }, POLL);
      window.addEventListener("pagehide", stop);
    });
  </script>
</body>
</html>
