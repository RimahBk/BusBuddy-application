<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live map – BusBuddy</title>
  <link rel="stylesheet" href="js/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/map.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/vendor/leaflet/leaflet.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <header id="topbar"></header>
  <main class="container">
    <h1>Live bus map</h1>
    <p class="muted refresh-line">
      Positions refresh every <span id="poll-sec">10</span> seconds ·
      Last refreshed <span id="last-refresh">–</span>
    </p>
    <div id="map-msg" class="hidden"></div>

    <!-- Route filter: "All routes" + one chip per route, in the route's colour -->
    <div id="route-chips" class="chips hidden" role="group" aria-label="Show routes"></div>

    <div class="map-layout">
      <div id="map" class="map"></div>
      <section>
        <h2>Running buses</h2>
        <div id="bus-list" class="bus-list"><p class="muted">Loading…</p></div>
      </section>
    </div>
  </main>
  <footer class="site-footer">BusBuddy · LIU senior project</footer>

  <script type="module" src="js/pages/map-page.js"></script>
</body>
</html>
