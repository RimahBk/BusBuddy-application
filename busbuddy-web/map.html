<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live map – BusBuddy</title>
  <link rel="stylesheet" href="js/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/vendor/leaflet/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <style>
    /* Map on the left, list of running buses on the right (stacked on phones) */
    .map-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
    @media (max-width: 820px) { .map-layout { grid-template-columns: 1fr; } }
    .bus-list { display: flex; flex-direction: column; gap: 10px; }
    .bus-card { padding: 12px 14px; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit;
                border-left: 5px solid var(--route, var(--border)); }
    .bus-card + .bus-card { margin-top: 0; }
    .bus-card:hover, .bus-card:focus { border-color: var(--green); border-left-color: var(--route, var(--green)); outline: none; }
    .bus-card .muted { margin: 2px 0 0; }
    .refresh-line { margin: -6px 0 14px; }
    .popup-title { font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .stop-route { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; }
    .stop-route .route-dot { position: relative; top: 1px; }
    .me-dist { margin-top: 6px; color: var(--green-dark); font-weight: bold; }
  </style>
</head>
<body>
  <header id="topbar"></header>
  <main class="container">
    <h1>Live bus map</h1>
    <p class="muted refresh-line">
      Positions refresh every <span id="poll-sec">10</span> seconds ·
      Last refreshed <span id="last-refresh">–</span>
    </p>
    <div id="map-msg" class="hidden"></div>

    <!-- Route filter: "All routes" + one chip per route, in the route's colour -->
    <div id="route-chips" class="chips hidden" role="group" aria-label="Show routes"></div>

    <div class="map-layout">
      <div id="map" class="map"></div>
      <section>
        <h2>Running buses</h2>
        <div id="bus-list" class="bus-list"><p class="muted">Loading…</p></div>
      </section>
    </div>
  </main>
  <footer class="site-footer">BusBuddy · LIU senior project</footer>

  <script>
    BB.ready(async () => {
      await BB.renderNav("map.html");
      if (!BB.db) {                                          // setup not done yet: the banner explains
        BB.$(".map-layout").classList.add("hidden"); BB.$(".refresh-line").classList.add("hidden"); return;
      }

      const POLL = (window.BB_CONFIG && BB_CONFIG.POLL_SECONDS) || 10;
      BB.$("#poll-sec").textContent = POLL;

      // ---------------------------------------------------------------
      // 1. Create the map and load the routes and their stops (once)
      // ---------------------------------------------------------------
      const map = BB.makeMap("map");
      let stopsByRoute = {}, routes = [];
      try {
        stopsByRoute = await BB.loadStopsByRoute();
        const { data, error } = await BB.db.from("routes").select("*").order("route_id");
        if (error) throw error;
        routes = data || [];
      } catch (e) { BB.toast(BB.errText(e), "error"); }
      const routeById = {};
      routes.forEach((r) => { routeById[r.route_id] = r; });
      const colorOf = (id) => BB.routeColor(routeById[id] || id);

      // Each route = one layer group (its line + its stops), so the filter can show or hide it
      const routeLayers = {};      // route_id → { group, line, bounds }
      const stopMarkers = [];      // [{ stop, marker }] – used by "Nearest stop"
      Object.entries(stopsByRoute).forEach(([rid, stops]) => {
        const id = Number(rid), color = colorOf(id);
        const group = L.layerGroup().addTo(map);
        const lineLatLngs = BB.routeLine(stops);          // road shape if the route has one, else stop to stop
        const line = L.polyline(lineLatLngs, { color, weight: 4, opacity: 0.85 }).addTo(group);
        stops.forEach((s) => {
          // The popup text is built when the stop is clicked, so it uses the latest bus positions
          const marker = L.marker([s.latitude, s.longitude], { icon: BB.stopIcon(color) })
            .bindPopup(() => stopPopupHtml(s))
            .addTo(group);
          stopMarkers.push({ stop: s, marker });
        });
        routeLayers[id] = { group, line, points: lineLatLngs };
      });

      // ---------------------------------------------------------------
      // 2. Route filter (chips). ?route=<id> opens the map on one route.
      // ---------------------------------------------------------------
      let selected = null;                                   // null = all routes
      const wantTrip = Number(BB.param("trip"));             // read before the filter rewrites the address
      const wanted = Number(BB.param("route"));
      if (wanted && routeById[wanted]) selected = wanted;
      const visible = (routeId) => selected == null || selected === routeId;

      function renderChips() {
        const box = BB.$("#route-chips");
        if (routes.length < 2) { box.classList.add("hidden"); return; }
        box.classList.remove("hidden");
        box.innerHTML = `<button class="chip" data-route="" aria-pressed="${selected == null}">All routes</button>` +
          routes.map((r) => `<button class="chip" data-route="${r.route_id}" aria-pressed="${selected === r.route_id}">
              ${BB.routeDot(r)}${BB.esc(r.name)}</button>`).join("");
      }
      BB.$("#route-chips").addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (!chip) return;
        const id = chip.dataset.route ? Number(chip.dataset.route) : null;
        if (id === selected) return;
        setFilter(id, true);
      });

      function setFilter(routeId, fit) {
        selected = routeId;
        history.replaceState(null, "", selected == null ? "map.html" : "map.html?route=" + selected);
        Object.entries(routeLayers).forEach(([id, l]) => {
          if (visible(Number(id))) { if (!map.hasLayer(l.group)) l.group.addTo(map); l.line.bringToFront(); }
          else map.removeLayer(l.group);
        });
        Object.values(markers).forEach((m) => {
          if (visible(m.routeId)) { if (!map.hasLayer(m.marker)) m.marker.addTo(map); }
          else map.removeLayer(m.marker);
        });
        clearNearestLine();
        renderChips();
        renderList();
        if (fit) fitVisible();
      }

      function fitVisible() {
        const pts = [];
        Object.entries(routeLayers).forEach(([id, l]) => { if (visible(Number(id))) pts.push(...l.points); });
        if (pts.length) map.fitBounds(pts, { padding: [30, 30] });
      }

      // ---------------------------------------------------------------
      // 3. "Locate me" and "Nearest stop" (buttons drawn on the map)
      // ---------------------------------------------------------------
      let me = null, meDot = null, meRing = null, nearestLine = null;

      const Tools = L.Control.extend({
        options: { position: "topright" },
        onAdd() {
          const div = L.DomUtil.create("div", "leaflet-bar map-tools");
          div.innerHTML = `<button type="button" id="locate-btn">📍 Locate me</button>
                           <button type="button" id="nearest-btn">🚏 Nearest stop</button>`;
          L.DomEvent.disableClickPropagation(div);
          L.DomEvent.disableScrollPropagation(div);
          return div;
        }
      });
      map.addControl(new Tools());

      function locationProblem() {
        if (!navigator.geolocation) return "This browser cannot find your location.";
        const local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        if (location.protocol !== "https:" && !local) return "Your location only works on a secure (https://) page.";
        return null;
      }
      function geoErrorText(err) {
        if (err.code === 1) return "Location is blocked. Allow location for this site in your browser or app settings.";
        if (err.code === 3) return "Finding your location took too long. Check that GPS is on and try again.";
        return "Your location is not available. Turn on GPS / location and try again.";
      }

      // Ask for the position once, then draw a blue dot (and how precise it is)
      async function locate(btn) {
        const problem = locationProblem();
        if (problem) { BB.toast(problem, "error"); return null; }
        BB.busy(btn, true, "Finding you…");
        try {
          const pos = await new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(
            resolve, reject, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }));
          me = L.latLng(pos.coords.latitude, pos.coords.longitude);
          const acc = Math.min(pos.coords.accuracy || 0, 2000);
          if (!meDot) {
            meRing = L.circle(me, { radius: acc, color: "#1A73E8", weight: 1, fillOpacity: 0.1, interactive: false }).addTo(map);
            meDot = L.circleMarker(me, { radius: 8, color: "#FFFFFF", weight: 3, fillColor: "#1A73E8", fillOpacity: 1 })
              .bindTooltip("You are here").addTo(map);
          } else { meRing.setLatLng(me).setRadius(acc); meDot.setLatLng(me); }
          return me;
        } catch (err) {
          BB.toast(geoErrorText(err), "error");
          return null;
        } finally { BB.busy(btn, false); }
      }

      BB.$("#locate-btn").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        if (!(await locate(btn))) return;
        map.setView(me, Math.max(map.getZoom(), 14));
        if (window.innerWidth <= 820) BB.$("#map").scrollIntoView({ behavior: "smooth", block: "center" });
      });

      BB.$("#nearest-btn").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        if (!(await locate(btn))) return;
        const candidates = stopMarkers.filter((x) => visible(x.stop.route_id));
        if (!candidates.length) { BB.toast("There are no stops to show."); return; }
        let best = null, bestKm = Infinity;
        candidates.forEach((x) => {
          const km = BB.distanceKm(me.lat, me.lng, x.stop.latitude, x.stop.longitude);
          if (km < bestKm) { bestKm = km; best = x; }
        });
        clearNearestLine();
        const stopLL = best.marker.getLatLng();
        nearestLine = L.polyline([me, stopLL], { color: "#1A73E8", weight: 3, dashArray: "6 8", interactive: false }).addTo(map);
        map.fitBounds([me, stopLL], { padding: [60, 60], maxZoom: 16 });
        best.marker.openPopup();
        if (window.innerWidth <= 820) BB.$("#map").scrollIntoView({ behavior: "smooth", block: "center" });
      });

      function clearNearestLine() { if (nearestLine) { map.removeLayer(nearestLine); nearestLine = null; } }

      const fmtDistance = (km) => km < 1 ? `${Math.max(10, Math.round(km * 100) * 10)} m` : `${km.toFixed(1)} km`;
      const walkMinutes = (km) => Math.max(1, Math.round(km * 1.3 / 5 * 60));       // ~5 km/h, roads are not straight

      // ---------------------------------------------------------------
      // 4. Popup texts
      // ---------------------------------------------------------------
      let buses = [];                // latest result of get_live_buses()
      const markers = {};            // trip_id → { marker, status, routeId, last: [lat, lng] }

      function updatedText(iso) {
        const m = BB.minutesAgo(iso);
        if (m == null) return "No position yet";
        return m < 1 ? "Updated just now" : `Updated ${m} min ago`;
      }
      function seatsText(n) { return `${n} seat${n === 1 ? "" : "s"} free`; }

      // Bus popup: route, plate, status, delay, seats, last update and ETA at each stop ahead
      function busPopupHtml(bus) {
        const eta = BB.computeEta(bus, stopsByRoute[bus.route_id]);
        const etaHtml = eta.length
          ? `<ul class="eta-list">${eta.map((e) => `<li>${BB.esc(e.stop.address)} – ${e.minutes} min</li>`).join("")}</ul>`
          : `<p class="muted">No more stops ahead.</p>`;
        return `<div class="popup-title">${BB.routeDot(routeById[bus.route_id] || bus.route_id)}${BB.esc(bus.route_name)}</div>
          <div>${BB.esc(bus.plate_number)} ${BB.badge(bus.status)}</div>
          ${bus.delay_minutes ? `<div style="color:var(--amber)">Delayed ~${bus.delay_minutes} min – ${BB.esc(bus.delay_reason || "")}</div>` : ""}
          <div>${seatsText(bus.available_seats)}</div>
          <div class="muted">${updatedText(bus.last_update)}</div>
          <div style="margin-top:6px"><b>Arrival times</b></div>${etaHtml}
          <p style="margin:8px 0 0"><a href="schedules.html?route=${bus.route_id}">Reserve a seat on a later bus</a></p>`;
      }

      // Soonest bus that still has this stop ahead of it
      function nextBusAt(stop) {
        let best = null;
        buses.filter((b) => b.route_id === stop.route_id && b.latitude != null).forEach((b) => {
          const hit = BB.computeEta(b, stopsByRoute[b.route_id]).find((e) => e.stop.stop_id === stop.stop_id);
          if (hit && (!best || hit.minutes < best.minutes)) best = { bus: b, minutes: hit.minutes };
        });
        return best;
      }

      // Stop popup. Several routes often share a stop (e.g. near Cola), so every visible
      // route with a stop within 150 m is listed, each with its own next bus.
      function stopPopupHtml(stop) {
        const near = {};
        stopMarkers.forEach(({ stop: s }) => {
          if (s.route_id !== stop.route_id && !visible(s.route_id)) return;
          const km = BB.distanceKm(stop.latitude, stop.longitude, s.latitude, s.longitude);
          if (km > 0.15) return;
          if (!near[s.route_id] || km < near[s.route_id].km) near[s.route_id] = { stop: s, km };
        });
        const lines = Object.values(near)
          .sort((a, b) => (b.stop.route_id === stop.route_id) - (a.stop.route_id === stop.route_id)   // clicked route first
                          || a.stop.route_id - b.stop.route_id)
          .map(({ stop: s }) => {
            const r = routeById[s.route_id], next = nextBusAt(s);
            const text = next ? `next bus <b>${next.minutes} min</b> (${BB.esc(next.bus.plate_number)})`
                              : `no bus on the way – <a href="schedules.html?route=${s.route_id}">schedules</a>`;
            return `<div class="stop-route">${BB.routeDot(r || s.route_id)}<span><b>${BB.esc(r ? r.name : "Route " + s.route_id)}</b>: ${text}</span></div>`;
          }).join("");
        let dist = "";
        if (me) {
          const km = BB.distanceKm(me.lat, me.lng, stop.latitude, stop.longitude);
          dist = `<div class="me-dist">${fmtDistance(km)} from you${km < 5 ? ` · about ${walkMinutes(km)} min walk` : ""}</div>`;
        }
        return `<div class="popup-title">${BB.esc(stop.address)}</div>${lines}${dist}`;
      }

      // ---------------------------------------------------------------
      // 5. Side list of running buses (cards). Clicking one zooms to the bus.
      // ---------------------------------------------------------------
      function renderList() {
        const box = BB.$("#bus-list");
        const shown = buses.filter((b) => visible(b.route_id));
        if (!shown.length) {
          const where = selected == null ? "" : ` on ${BB.esc((routeById[selected] || {}).name || "this route")}`;
          box.innerHTML = `<div class="card empty">No buses are running${where} right now.<br>
            <a href="schedules.html${selected == null ? "" : "?route=" + selected}">See the schedules</a></div>`;
          return;
        }
        box.innerHTML = shown.map((b) => {
          const next = BB.computeEta(b, stopsByRoute[b.route_id])[0];
          const nextText = b.latitude == null ? "Waiting for the first position"
            : next ? `Next: ${BB.esc(next.stop.address)} – ${next.minutes} min` : "Arriving at the last stop";
          return `<button class="card bus-card" data-trip="${b.trip_id}" style="--route:${BB.esc(colorOf(b.route_id))}">
              <div class="row-between"><b>${BB.esc(b.route_name)}</b>${BB.badge(b.status)}</div>
              <p class="muted">${BB.esc(b.plate_number)} · ${seatsText(b.available_seats)}</p>
              <p class="muted">${nextText}</p>
            </button>`;
        }).join("");
        BB.$$(".bus-card", box).forEach((el) => el.addEventListener("click", () => focusBus(Number(el.dataset.trip))));
      }

      function focusBus(tripId) {
        const m = markers[tripId];
        if (!m) { BB.toast("This bus has not shared its position yet."); return; }
        if (!visible(m.routeId)) setFilter(null, false);    // the bus is on a hidden route: show all again
        if (window.innerWidth <= 820) BB.$("#map").scrollIntoView({ behavior: "smooth" });
        map.setView(m.marker.getLatLng(), Math.max(map.getZoom(), 14));
        m.marker.openPopup();
      }

      // ---------------------------------------------------------------
      // 6. Polling: ask for the running buses every POLL seconds and
      //    create / slide / turn / update / remove one marker per trip
      // ---------------------------------------------------------------
      async function refresh() {
        const { data, error } = await BB.db.rpc("get_live_buses");
        if (error) { BB.show("#map-msg", BB.errText(error), "error"); return; }
        BB.show("#map-msg", "");
        buses = data || [];

        const seen = new Set();
        buses.forEach((b) => {
          if (b.latitude == null) return;                    // trip started but no position yet: listed only
          seen.add(b.trip_id);
          const pos = [b.latitude, b.longitude];
          const color = colorOf(b.route_id);
          let m = markers[b.trip_id];
          if (!m) {
            // First time: point the arrow at the next stop ahead until the bus has moved
            const next = BB.computeEta(b, stopsByRoute[b.route_id])[0];
            const heading = next ? BB.bearing(b.latitude, b.longitude, next.stop.latitude, next.stop.longitude) : null;
            const marker = L.marker(pos, { icon: BB.busIcon(b.status, color, heading) }).bindPopup("");
            marker.on("add", () => BB.applyBusHeading(marker));   // re-shown by the filter: keep its direction
            m = markers[b.trip_id] = { marker, status: b.status, routeId: b.route_id, last: pos };
            BB.setBusHeading(marker, heading);
            if (visible(b.route_id)) marker.addTo(map);
          } else {
            // Moved more than ~15 m: turn the arrow toward the way it went, then slide there
            if (BB.distanceKm(m.last[0], m.last[1], pos[0], pos[1]) > 0.015) {
              BB.setBusHeading(m.marker, BB.bearing(m.last[0], m.last[1], pos[0], pos[1]));
            }
            m.last = pos;
            BB.slideMarker(m.marker, pos, Math.min(1500, POLL * 500));
            if (m.status !== b.status) {
              m.marker.setIcon(BB.busIcon(b.status, color, m.marker.bb && m.marker.bb.heading));
              m.status = b.status;
            }
          }
          m.marker.setPopupContent(busPopupHtml(b));         // stays open if the user opened it
        });
        // Remove markers of trips that ended
        Object.keys(markers).forEach((id) => {
          if (!seen.has(Number(id))) { map.removeLayer(markers[id].marker); delete markers[id]; }
        });

        renderList();
        BB.$("#last-refresh").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      }

      // ---------------------------------------------------------------
      // 7. Start: draw the chips, show the chosen route(s), first refresh,
      //    then ?trip=<id> (from "Track my bus"), then keep polling
      // ---------------------------------------------------------------
      setFilter(selected, true);

      let first = true;
      const stop = BB.poll(async () => {
        await refresh();
        if (first) {
          first = false;
          const want = wantTrip;
          if (want) {
            if (markers[want]) focusBus(want);
            else BB.toast(buses.some((b) => b.trip_id === want)
              ? "Your bus has not shared its position yet." : "This trip is not running right now.");
          }
        }
      }, POLL);
      window.addEventListener("pagehide", stop);
    });
  </script>
</body>
</html>
