<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in – BusBuddy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/login.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <header id="topbar"></header>

  <main class="container narrow">
    <div class="card">
      <h1>Log in</h1>
      <p class="muted">Passengers, drivers and administrators all log in here.</p>

      <div id="msg" class="hidden"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-row">
            <input id="password" type="password" autocomplete="current-password" required>
            <button type="button" class="btn btn-outline" id="togglePw" aria-label="Show password">Show</button>
          </div>
        </div>
        <button type="submit" class="btn btn-block" id="loginBtn">Log in</button>
      </form>

      <button type="button" class="btn btn-outline btn-block" id="forgotBtn" style="margin-top:10px">Forgot password?</button>

      <div class="links">
        <p>New passenger? <a href="register.html">Create an account</a></p>
        <p><a href="map.html">View the live map without an account</a></p>
      </div>
    </div>

    <!-- MOBILE APP PLACEHOLDER: replace this card with the Play Store link / app screenshot when the Android app is published -->
    <div class="app-card" id="appCard">
      <div class="card-title">📱 BusBuddy Android app – coming soon</div>
      <p class="muted">The app opens this same website, so you log in with the same email and password.</p>
    </div>
    <!-- END MOBILE APP PLACEHOLDER -->
  </main>

  <footer class="site-footer">BusBuddy · LIU senior project</footer>

  <script type="module" src="js/pages/login-page.js"></script>
</body>
</html>
