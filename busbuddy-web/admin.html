<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage system – BusBuddy</title>
  <link rel="stylesheet" href="js/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/admin.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/vendor/leaflet/leaflet.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <header id="topbar"></header>
  <main class="container">
    <h1>Manage system</h1>
    <div class="tabs" role="tablist">
      <button class="tab" data-tab="buses">Buses</button>
      <button class="tab" data-tab="routes">Routes &amp; stops</button>
      <button class="tab" data-tab="trips">Trips</button>
      <button class="tab" data-tab="accounts">Accounts</button>
    </div>

    <!-- ===== a) BUSES ===== -->
    <section class="panel hidden" id="panel-buses">
      <form class="card" id="bus-form">
        <div class="card-title" id="bus-form-title">Add bus</div>
        <input type="hidden" id="bus-id">
        <div class="form-grid">
          <div class="field"><label for="bus-plate">Plate number</label><input id="bus-plate" required placeholder="G 123456"></div>
          <div class="field"><label for="bus-cap">Capacity (seats)</label><input id="bus-cap" type="number" min="1" max="60" required></div>
          <div class="field"><label for="bus-owner">Owner driver</label><select id="bus-owner"></select></div>
        </div>
        <div class="row"><button class="btn" id="bus-save">Save bus</button><button type="button" class="btn btn-outline hidden" id="bus-cancel">Cancel edit</button></div>
      </form>
      <div class="card"><div class="card-title">All buses</div><div id="bus-list"></div></div>
    </section>

    <!-- ===== b) ROUTES & STOPS ===== -->
    <section class="panel hidden" id="panel-routes">
      <div class="card">
        <div class="row">
          <div class="field" style="flex:1;min-width:200px;margin:0"><label for="route-select">Route</label><select id="route-select"></select></div>
          <button class="btn btn-outline" id="route-new-btn" style="align-self:flex-end">New route</button>
        </div>
        <form id="route-form" class="hidden" style="margin-top:14px">
          <div class="form-grid">
            <div class="field"><label for="route-name">Name</label><input id="route-name" required placeholder="Chouf – LIU Cola"></div>
            <div class="field"><label for="route-origin">Origin</label><input id="route-origin" required></div>
            <div class="field"><label for="route-dest">Destination</label><input id="route-dest" required></div>
          </div>
          <button class="btn">Create route</button>
        </form>
      </div>
      <div class="card">
        <div id="route-map" class="map"></div>
        <p class="muted">Click the map to place a stop.</p>
        <form id="stop-form">
          <div class="card-title" id="stop-form-title">Add stop</div>
          <input type="hidden" id="stop-id">
          <div class="form-grid">
            <div class="field"><label for="stop-address">Address</label><input id="stop-address" required></div>
            <div class="field"><label for="stop-lat">Latitude</label><input id="stop-lat" type="number" step="any" required></div>
            <div class="field"><label for="stop-lng">Longitude</label><input id="stop-lng" type="number" step="any" required></div>
            <div class="field"><label for="stop-order">Stop order</label><input id="stop-order" type="number" min="1" required></div>
            <div class="field"><label for="stop-min">Minutes from start</label><input id="stop-min" type="number" min="0" value="0" required></div>
          </div>
          <div class="row"><button class="btn" id="stop-save">Save stop</button><button type="button" class="btn btn-outline hidden" id="stop-cancel">Cancel edit</button></div>
        </form>
      </div>
      <div class="card"><div class="card-title">Stops of this route</div><div id="stop-list"></div></div>
    </section>

    <!-- ===== c) TRIPS ===== -->
    <section class="panel hidden" id="panel-trips">
      <form class="card" id="trip-form">
        <div class="card-title">Create trip</div>
        <div class="form-grid">
          <div class="field"><label for="trip-route">Route</label><select id="trip-route" required></select></div>
          <div class="field"><label for="trip-bus">Bus</label><select id="trip-bus" required></select></div>
          <div class="field"><label for="trip-driver">Driver</label><select id="trip-driver" required></select></div>
          <div class="field"><label for="trip-dep">Departure</label><input id="trip-dep" type="datetime-local" required></div>
        </div>
        <button class="btn" id="trip-save">Create trip</button>
      </form>
      <div class="card"><div class="card-title">Upcoming and running trips</div><div id="trip-list"></div></div>
    </section>

    <!-- ===== d) ACCOUNTS ===== -->
    <section class="panel hidden" id="panel-accounts">
      <form class="card" id="driver-form">
        <div class="card-title">Create driver account</div>
        <div id="driver-msg" class="hidden"></div>
        <div class="form-grid">
          <div class="field"><label for="dr-name">Full name</label><input id="dr-name" required></div>
          <div class="field"><label for="dr-email">Email</label><input id="dr-email" type="email" required></div>
          <div class="field"><label for="dr-phone">Phone</label><input id="dr-phone" type="tel" placeholder="+96170123456" required></div>
          <div class="field"><label for="dr-pass">Temporary password</label><input id="dr-pass" type="text" minlength="8" required></div>
          <div class="field"><label for="dr-lic">Licence number</label><input id="dr-lic" required></div>
        </div>
        <button class="btn" id="dr-save">Create driver</button>
      </form>
      <div class="card">
        <div class="row-between"><div class="card-title">All accounts</div><input id="acc-search" type="search" placeholder="Search name, email or phone" style="max-width:320px"></div>
        <div id="acc-note" class="hidden"></div>
        <div id="acc-list" style="margin-top:10px"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer">BusBuddy · LIU senior project</footer>

  <script type="module" src="js/pages/admin-page.js"></script>
</body>
</html>
