<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet monitor – BusBuddy</title>
  <link rel="stylesheet" href="js/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/monitor.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/vendor/leaflet/leaflet.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <header id="topbar"></header>
  <main class="container">
    <div class="row-between">
      <h1>Fleet monitor</h1>
      <span class="muted" id="updated-at"></span>
    </div>

    <!-- Three small summary numbers -->
    <div class="grid-3 stats">
      <div class="card stat"><div class="stat-value" id="stat-running">–</div><div class="stat-label">Running buses</div></div>
      <div class="card stat"><div class="stat-value" id="stat-delayed">–</div><div class="stat-label">Delayed</div></div>
      <div class="card stat"><div class="stat-value" id="stat-seats">–</div><div class="stat-label">Seats taken</div></div>
    </div>

    <div class="map-wrap"><div id="fleet-map" class="map"></div></div>

    <div class="card">
      <div class="card-title">Running trips</div>
      <p class="muted">Rows in yellow have not sent a position for more than <span id="stale-min">3</span> minutes. Click a row to find the bus on the map.</p>
      <div id="fleet-box"></div>
    </div>
  </main>
  <footer class="site-footer">BusBuddy · LIU senior project</footer>

  <script type="module" src="js/pages/monitor-page.js"></script>
</body>
</html>
