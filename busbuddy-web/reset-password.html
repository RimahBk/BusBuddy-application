<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New password – BusBuddy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <style>
    main.container.narrow { max-width: 440px; }   /* style.css's main.container rule would otherwise win over .narrow */
  </style>
</head>
<body>
  <header id="topbar"></header>

  <main class="container narrow">
    <div class="card">
      <h1>Choose a new password</h1>

      <!-- While we check the link from the email -->
      <p class="muted" id="checking">Checking your reset link…</p>

      <div id="msg" class="hidden"></div>

      <!-- Link not valid -->
      <div id="badLink" class="hidden">
        <div class="alert alert-error">This link is invalid or expired. Ask for a new one from the login page.</div>
        <a class="btn btn-block" href="login.html">Go to log in</a>
      </div>

      <!-- Password saved -->
      <div id="done" class="hidden">
        <div class="alert alert-ok">Your password has been changed. Log in with your new password.</div>
        <a class="btn btn-block" href="login.html">Log in</a>
      </div>

      <form id="pwForm" class="hidden" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" autocomplete="new-password" minlength="8" required>
          <p class="muted" style="margin:4px 0 0">At least 8 characters.</p>
        </div>
        <div class="field">
          <label for="password2">Confirm new password</label>
          <input id="password2" type="password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-block" id="saveBtn">Save new password</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">BusBuddy · LIU senior project</footer>

  <script>
    BB.ready(async () => {
      // 1. Navigation bar
      await BB.renderNav("reset-password.html");
      if (!BB.db) { BB.$("#checking").classList.add("hidden"); return; }   // setup not done yet

      const msg = BB.$("#msg");
      let decided = false;

      // Show the form (the email link gave us a recovery session)
      function showForm() {
        if (decided) return;
        decided = true;
        BB.$("#checking").classList.add("hidden");
        BB.$("#pwForm").classList.remove("hidden");
      }

      // 2. The link in the email carries a recovery session in the URL.
      //    supabase-js reads it and tells us with the PASSWORD_RECOVERY event…
      BB.db.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") showForm();
      });
      //    …or the session may already be stored by the time this code runs
      const { data } = await BB.db.auth.getSession();
      if (data && data.session) showForm();

      // 3. Nothing after ~3 seconds → the link is wrong or too old
      setTimeout(() => {
        if (decided) return;
        decided = true;
        BB.$("#checking").classList.add("hidden");
        BB.$("#badLink").classList.remove("hidden");
      }, 3000);

      // 4. Save the new password
      BB.$("#pwForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = BB.$("#password").value;
        const password2 = BB.$("#password2").value;
        if (password.length < 8) { BB.show(msg, "The password must have at least 8 characters.", "error"); return; }
        if (password !== password2) { BB.show(msg, "The two passwords are not the same.", "error"); return; }

        const btn = BB.$("#saveBtn");
        BB.busy(btn, true, "Saving…");
        BB.show(msg, "");
        const { error } = await BB.db.auth.updateUser({ password });
        BB.busy(btn, false);
        if (error) { BB.show(msg, BB.errText(error), "error"); return; }

        // Sign out so the user logs in fresh with the new password
        await BB.db.auth.signOut();
        BB.$("#pwForm").classList.add("hidden");
        BB.$("#done").classList.remove("hidden");
      });
    });
  </script>
</body>
</html>
