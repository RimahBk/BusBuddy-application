<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My trips – BusBuddy</title>
  <link rel="stylesheet" href="js/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/driver.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/vendor/leaflet/leaflet.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <header id="topbar"></header>
  <main class="container driver-page">
    <h1>My trips</h1>
    <div id="startMsg" class="hidden"></div>

    <!-- A. Running trip (shown only while a trip is active or delayed) -->
    <section id="running" class="card hidden">
      <div class="run-label">Running trip</div>
      <div class="row-between">
        <div>
          <div class="card-title" id="runRoute"></div>
          <div class="row" id="runInfo"></div>
        </div>
        <div class="seats-box"><div class="muted">Seats</div><div class="seats-big" id="runSeats"></div></div>
      </div>
      <div id="shareStatus" class="hidden" style="margin-top:12px"></div>
      <button class="btn btn-amber btn-block hidden" id="resumeBtn">Turn on location sharing</button>
      <div id="driverMap" class="map map-small"></div>
      <div class="actions">
        <button class="btn btn-purple" id="walkOnBtn">Roadside passenger +1</button>
        <button class="btn btn-amber" id="delayBtn">Report delay</button>
        <button class="btn btn-danger" id="endBtn">End trip</button>
      </div>

      <!-- Report delay form (UC-16) -->
      <div id="delayForm" class="card hidden">
        <div class="card-title">Report delay</div>
        <label>Reason</label>
        <div class="reasons" id="reasons">
          <button type="button" class="tab" data-r="Traffic">Traffic</button>
          <button type="button" class="tab" data-r="Breakdown">Breakdown</button>
          <button type="button" class="tab" data-r="Weather">Weather</button>
          <button type="button" class="tab" data-r="Accident">Accident</button>
          <button type="button" class="tab" data-r="Other">Other</button>
        </div>
        <div class="field hidden" id="otherWrap">
          <label for="otherReason">Describe the reason</label>
          <input id="otherReason" maxlength="100" autocomplete="off">
        </div>
        <div class="field">
          <label for="delayMin">Minutes late</label>
          <select id="delayMin">
            <option>5</option><option selected>10</option><option>15</option><option>20</option>
            <option>30</option><option>45</option><option>60</option>
          </select>
        </div>
        <div id="delayMsg" class="hidden"></div>
        <div class="actions-2">
          <button type="button" class="btn btn-outline" id="delayCancel">Cancel</button>
          <button type="button" class="btn btn-amber" id="delaySubmit">Submit</button>
        </div>
      </div>

      <h3 class="section-title">Passengers on this trip</h3>
      <div id="runPassengers"></div>
    </section>

    <!-- B. Upcoming trips -->
    <section id="upcomingWrap" class="hidden">
      <h2 class="section-title">Upcoming trips</h2>
      <div id="upcoming"></div>
    </section>

    <!-- C. Earlier today -->
    <details id="earlierWrap" class="earlier hidden">
      <summary id="earlierTitle">Earlier today</summary>
      <div id="earlier"></div>
    </details>

    <p id="emptyState" class="empty hidden">No trips assigned to you yet. The administrator assigns trips.</p>
  </main>
  <footer class="site-footer">BusBuddy · LIU senior project</footer>

  <script type="module" src="js/pages/driver-page.js"></script>
</body>
</html>
