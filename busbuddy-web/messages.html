<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages – BusBuddy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/messages.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <header id="topbar"></header>
  <main class="container">
    <h1>Messages</h1>
    <div class="msg-layout" id="layout">
      <!-- Left: conversations -->
      <section class="conv-pane">
        <div class="card conv-list" id="conv-list"><p class="muted" style="padding:12px">Loading conversations…</p></div>
      </section>

      <!-- Right: the open chat -->
      <section class="chat-pane card" id="chat-pane">
        <div id="chat-empty" class="empty">Choose a conversation to read and send messages.</div>
        <div id="chat-box" class="hidden">
          <div class="chat-head">
            <div class="head-row">
              <button class="btn btn-outline btn-small back-btn" id="back-btn" aria-label="Back to conversations">←</button>
              <div class="head-info">
                <div class="card-title" id="chat-name"></div>
                <div class="muted" id="chat-trip"></div>
              </div>
              <button class="btn btn-outline btn-small" id="call-btn">📞 Call</button>
            </div>
            <div class="phone-line hidden" id="phone-line"></div>
          </div>
          <div class="chat" id="chat" aria-live="polite"></div>
          <div id="send-alert" class="hidden" style="margin-top:12px"></div>
          <form id="send-form" autocomplete="off">
            <div class="send-row">
              <textarea id="msg-text" maxlength="500" placeholder="Write a message…" aria-label="Message"></textarea>
              <button class="btn" id="send-btn" type="submit">Send</button>
            </div>
            <div class="counter muted"><span id="count">0</span>/500 · Enter to send, Shift+Enter for a new line</div>
          </form>
        </div>
      </section>
    </div>
  </main>
  <footer class="site-footer">BusBuddy · LIU senior project</footer>

  <script type="module" src="js/pages/messages-page.js"></script>
</body>
</html>
