<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages – BusBuddy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <style>
    /* Page-specific layout: list on the left, chat on the right (laptop) */
    .msg-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; align-items: start; }
    .conv-list { padding: 6px; }
    .conv {
      display: block; width: 100%; text-align: left; font-family: inherit; font-size: 15px; color: var(--text);
      background: none; border: none; border-radius: 8px; padding: 12px; cursor: pointer; min-height: 44px;
    }
    .conv + .conv { border-top: 1px solid var(--border); border-radius: 0; }
    .conv:hover { background: var(--bg); }
    .conv.active { background: var(--green-light); border-radius: 8px; }
    .conv-name { font-weight: bold; }
    .conv-preview { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .unread { background: var(--red); color: var(--white); border-radius: 999px; font-size: 12px; font-weight: bold;
              min-width: 22px; padding: 2px 7px; text-align: center; }
    .chat-head { margin-bottom: 12px; }
    .head-row { display: flex; gap: 10px; align-items: center; }
    .head-info { flex: 1; min-width: 0; }
    .head-row .btn { flex-shrink: 0; min-height: 44px; }
    .chat-head .phone-line { font-size: 15px; margin-top: 6px; }
    .send-row { display: flex; gap: 10px; align-items: flex-end; margin-top: 12px; }
    .send-row textarea { min-height: 52px; height: 52px; flex: 1; }
    .counter { font-size: 12px; text-align: right; margin-top: 4px; }
    .back-btn { display: none; }
    /* Phone: show the list OR the chat, never both */
    @media (max-width: 820px) {
      .msg-layout { grid-template-columns: 1fr; }
      .msg-layout.has-chat .conv-pane { display: none; }
      .msg-layout:not(.has-chat) .chat-pane { display: none; }
      .back-btn { display: inline-flex; }
      .chat { height: 55vh; }
    }
  </style>
</head>
<body>
  <header id="topbar"></header>
  <main class="container">
    <h1>Messages</h1>
    <div class="msg-layout" id="layout">
      <!-- Left: conversations -->
      <section class="conv-pane">
        <div class="card conv-list" id="conv-list"><p class="muted" style="padding:12px">Loading conversations…</p></div>
      </section>

      <!-- Right: the open chat -->
      <section class="chat-pane card" id="chat-pane">
        <div id="chat-empty" class="empty">Choose a conversation to read and send messages.</div>
        <div id="chat-box" class="hidden">
          <div class="chat-head">
            <div class="head-row">
              <button class="btn btn-outline btn-small back-btn" id="back-btn" aria-label="Back to conversations">←</button>
              <div class="head-info">
                <div class="card-title" id="chat-name"></div>
                <div class="muted" id="chat-trip"></div>
              </div>
              <button class="btn btn-outline btn-small" id="call-btn">📞 Call</button>
            </div>
            <div class="phone-line hidden" id="phone-line"></div>
          </div>
          <div class="chat" id="chat" aria-live="polite"></div>
          <div id="send-alert" class="hidden" style="margin-top:12px"></div>
          <form id="send-form" autocomplete="off">
            <div class="send-row">
              <textarea id="msg-text" maxlength="500" placeholder="Write a message…" aria-label="Message"></textarea>
              <button class="btn" id="send-btn" type="submit">Send</button>
            </div>
            <div class="counter muted"><span id="count">0</span>/500 · Enter to send, Shift+Enter for a new line</div>
          </form>
        </div>
      </section>
    </div>
  </main>
  <footer class="site-footer">BusBuddy · LIU senior project</footer>

  <script>
    BB.ready(async () => {
      await BB.renderNav("messages.html");
      if (!BB.db) {                                               // setup not done yet (banner explains)
        BB.$("#conv-list").innerHTML = `<div class="empty">Your conversations will appear here once the site is connected.</div>`;
        return;
      }
      const user = await BB.requireRole(["passenger", "driver"]);
      if (!user) return;

      // -----------------------------------------------------------------
      // 1. Page state
      // -----------------------------------------------------------------
      const me = user.type === "driver" ? "driver" : "passenger";   // value of messages.sent_by for my messages
      let conversations = [];        // rows from get_conversations()
      let current = null;            // { trip_id, passenger_id } of the open chat
      let listSig = "";              // fingerprint of the list, to redraw only when it changes
      let chatSig = "";              // fingerprint of the open chat (count + last id)
      const keyOf = (c) => c.trip_id + "|" + c.passenger_id;

      // -----------------------------------------------------------------
      // 2. Conversation list (one per trip + passenger, with unread count)
      // -----------------------------------------------------------------
      async function loadList() {
        const { data, error } = await BB.db.rpc("get_conversations");
        if (error) { BB.toast(BB.errText(error), "error"); return; }
        conversations = data || [];
        const sig = JSON.stringify(conversations.map((c) => [keyOf(c), c.unread, c.last_time]))
                  + (current ? keyOf(current) : "");
        if (sig === listSig) return;                                 // nothing changed → no flicker
        listSig = sig;
        renderList();
        if (current) fillHeader();                                   // the header uses the list data
      }

      function renderList() {
        const box = BB.$("#conv-list");
        if (!conversations.length) {
          box.innerHTML = `<div class="empty">No conversations yet. Conversations appear for ${
            me === "driver" ? "passengers who booked your trips" : "trips you have booked"}.</div>`;
          return;
        }
        box.innerHTML = conversations.map((c) => {
          const text = c.last_message || "No messages yet";
          const preview = text.length > 70 ? text.slice(0, 70) + "…" : text;
          const active = current && keyOf(current) === keyOf(c) ? "active" : "";
          return `<button class="conv ${active}" data-trip="${c.trip_id}" data-passenger="${BB.esc(c.passenger_id)}">
              <div class="row-between">
                <span class="conv-name">${BB.esc(c.other_name)}</span>
                ${c.unread > 0 ? `<span class="unread" aria-label="${c.unread} unread">${c.unread}</span>` : ""}
              </div>
              <div class="muted">${BB.esc(c.route_name)} · ${BB.esc(BB.fmtDateTime(c.departure_time))}</div>
              <div class="conv-preview">${BB.esc(preview)}${c.last_time ? " · " + BB.esc(BB.fmtTime(c.last_time)) : ""}</div>
            </button>`;
        }).join("");
      }

      BB.$("#conv-list").addEventListener("click", (e) => {
        const b = e.target.closest(".conv");
        if (b) openChat(Number(b.dataset.trip), b.dataset.passenger);
      });

      // -----------------------------------------------------------------
      // 3. Open a chat (from the list or from ?trip=&passenger= in the URL)
      // -----------------------------------------------------------------
      async function openChat(tripId, passengerId) {
        current = { trip_id: tripId, passenger_id: passengerId };
        chatSig = "";
        history.replaceState(null, "", `messages.html?trip=${tripId}&passenger=${encodeURIComponent(passengerId)}`);
        BB.$("#layout").classList.add("has-chat");                   // phones: show the chat instead of the list
        BB.$("#chat-empty").classList.add("hidden");
        BB.$("#chat-box").classList.remove("hidden");
        BB.$("#chat").innerHTML = `<p class="muted">Loading messages…</p>`;
        BB.show("#send-alert", "");
        setSending(true);
        BB.$("#phone-line").classList.add("hidden");
        fillHeader();
        listSig = "";                                                // redraw the list to highlight this chat
        renderList();
        await loadMessages();
        await markRead();
      }

      // Name and trip in the chat header (taken from the conversation list)
      function fillHeader() {
        const c = conversations.find((x) => keyOf(x) === keyOf(current));
        BB.$("#chat-name").textContent = c ? c.other_name : (me === "driver" ? "Passenger" : "Driver");
        BB.$("#chat-trip").textContent = c ? `${c.route_name} · ${BB.fmtDateTime(c.departure_time)}` : `Trip #${current.trip_id}`;
      }

      // Back button (phones only): return to the list
      BB.$("#back-btn").addEventListener("click", () => {
        current = null;
        history.replaceState(null, "", "messages.html");
        BB.$("#layout").classList.remove("has-chat");
        BB.$("#chat-box").classList.add("hidden");
        BB.$("#chat-empty").classList.remove("hidden");
        listSig = "";
        renderList();
      });

      // -----------------------------------------------------------------
      // 4. Messages of the open chat
      // -----------------------------------------------------------------
      async function loadMessages() {
        if (!current) return;
        const asked = keyOf(current);
        const { data, error } = await BB.db.from("messages").select("*")
          .eq("trip_id", current.trip_id).eq("passenger_id", current.passenger_id).order("date_time");
        if (!current || keyOf(current) !== asked) return;            // user switched chat meanwhile
        if (error) { BB.toast(BB.errText(error), "error"); return; }
        const msgs = data || [];
        const last = msgs[msgs.length - 1];
        const sig = msgs.length + ":" + (last ? last.message_id : "");
        if (sig === chatSig) return;                                 // nothing new → keep the screen as it is
        const hadBefore = chatSig !== "";
        chatSig = sig;

        const box = BB.$("#chat");
        box.innerHTML = msgs.length
          ? msgs.map((m) => `<div class="bubble ${m.sent_by === me ? "mine" : "theirs"}">${BB.esc(m.content)}<span class="time">${BB.esc(BB.fmtTime(m.date_time))}</span></div>`).join("")
          : `<p class="muted">No messages yet. Say hello to start the conversation.</p>`;
        box.scrollTop = box.scrollHeight;                            // jump to the newest message

        // A new message from the other person arrived while the chat is open → mark it read
        if (hadBefore && last && last.sent_by !== me) await markRead();
      }

      async function markRead() {
        if (!current) return;
        const { error } = await BB.db.rpc("mark_read", { p_trip_id: current.trip_id, p_passenger_id: current.passenger_id });
        if (error) console.error(error);
        await loadList();                                            // unread count goes back to 0
      }

      // -----------------------------------------------------------------
      // 5. Send a message (UC-02). The database checks the booking and that
      //    the trip has not ended; its error text is shown above the box.
      // -----------------------------------------------------------------
      const text = BB.$("#msg-text");
      text.addEventListener("input", () => { BB.$("#count").textContent = text.value.length; });
      text.addEventListener("keydown", (e) => {                      // Enter sends, Shift+Enter = new line
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); BB.$("#send-form").requestSubmit(); }
      });

      function setSending(enabled) {
        text.disabled = !enabled;
        BB.$("#send-btn").disabled = !enabled;
      }

      BB.$("#send-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const content = text.value.trim();
        if (!content || !current || text.disabled) return;
        const btn = BB.$("#send-btn");
        BB.busy(btn, true, "Sending…");
        const { error } = await BB.db.rpc("send_message", {
          p_trip_id: current.trip_id, p_passenger_id: current.passenger_id, p_content: content
        });
        BB.busy(btn, false);
        if (error) {
          BB.show("#send-alert", BB.errText(error), "error");
          setSending(false);                                         // e.g. trip ended / no booking
          return;
        }
        text.value = "";
        BB.$("#count").textContent = "0";
        text.focus();
        await loadMessages();
        await loadList();
      });

      // -----------------------------------------------------------------
      // 6. Call (UC-03): the number comes back only if a booking links us.
      //    Contact is by phone call or in-app message only.
      // -----------------------------------------------------------------
      BB.$("#call-btn").addEventListener("click", async () => {
        if (!current) return;
        const btn = BB.$("#call-btn");
        BB.busy(btn, true, "Getting number…");
        const { data: phone, error } = await BB.db.rpc("get_contact_phone", {
          p_trip_id: current.trip_id, p_passenger_id: current.passenger_id
        });
        BB.busy(btn, false);
        if (error) { BB.toast(BB.errText(error), "error"); return; }
        const who = me === "driver" ? "passenger" : "driver";
        if (!phone) { BB.toast(`The ${who}'s number is not available for this trip.`, "error"); return; }
        const clean = String(phone).replace(/[^+\d]/g, "");
        const line = BB.$("#phone-line");
        line.innerHTML = `${who === "driver" ? "Driver" : "Passenger"}'s number: <a href="tel:${BB.esc(clean)}"><b>${BB.esc(phone)}</b></a>`;
        line.classList.remove("hidden");                             // laptops cannot call, so show it
        location.href = "tel:" + clean;                              // opens the dialer on a phone
      });

      // -----------------------------------------------------------------
      // 7. Start: load the list, open the chat from the URL, then poll
      // -----------------------------------------------------------------
      await loadList();
      const tripParam = BB.param("trip"), passParam = BB.param("passenger");
      if (tripParam && passParam) await openChat(Number(tripParam), passParam);

      // Every POLL_SECONDS: new messages in the open chat + unread counts in the list
      let first = true;
      const stopPolling = BB.poll(async () => {
        if (first) { first = false; return; }                        // we just loaded everything above
        await loadMessages();
        await loadList();
      }, BB_CONFIG.POLL_SECONDS);
      window.addEventListener("pagehide", stopPolling);
    });
  </script>
</body>
</html>
